# GestãoZap — Nginx Config para VPS Hostinger
# Requisitos: wildcard cert em /etc/letsencrypt/live/gestaozap-wildcard/
#
# Obter certificado wildcard:
#   certbot certonly --manual --preferred-challenges dns \
#     -d "*.gestaozap.digital" -d "gestaozap.digital"

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name gestaozap.digital *.gestaozap.digital;
    return 301 https://$host$request_uri;
}

# Site marketing: gestaozap.digital (landing page)
server {
    listen 443 ssl http2;
    server_name gestaozap.digital www.gestaozap.digital;

    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/gestaozap-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestaozap-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass       http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }
}

# Painel admin: admin.gestaozap.digital
server {
    listen 443 ssl http2;
    server_name admin.gestaozap.digital;

    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/gestaozap-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestaozap-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Injeta X-Tenant-Slug: admin para o backend identificar contexto admin
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Tenant-Slug admin;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   X-Tenant-Slug admin;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass       http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }
}

# Tenants: [slug].gestaozap.digital  (wildcard)
server {
    listen 443 ssl http2;
    server_name ~^(?<tenant_slug>[a-z0-9][a-z0-9\-]*[a-z0-9])\.gestaozap\.digital$;

    client_max_body_size 50m;

    ssl_certificate     /etc/letsencrypt/live/gestaozap-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestaozap-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Slug do subdomínio → header X-Tenant-Slug para o backend
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Tenant-Slug $tenant_slug;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   X-Tenant-Slug $tenant_slug;
        proxy_read_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass       http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass       http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }
}
