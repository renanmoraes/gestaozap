name: gestaozap

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src
      - ./backend/uploads:/app/uploads
      - ./backend/backups:/app/backups
      - wwebjs_auth:/app/.wwebjs_auth
    environment:
      - TZ=America/Sao_Paulo
      - DATABASE_URL=postgresql://wa_invites:wa_invites@postgres:5432/wa_invites
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@gestaozap.digital}
      - ADMIN_SECRET=${ADMIN_SECRET:-dev-secret-change-in-production}
      # Senha do admin de recuperação (admin@gestaozap.digital) — definir no .env do servidor
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # AUTH_REQUIRED=true: exige token Bearer em todas as rotas de negócio (ativar em produção)
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      # Email transacional (Resend) — boas-vindas e reset de senha
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-noreply@gestaozap.digital}
      - APP_BASE_DOMAIN=${APP_BASE_DOMAIN:-gestaozap.digital}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "3002:3002"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    environment:
      - TZ=America/Sao_Paulo
      - VITE_BACKEND_PROXY_TARGET=http://backend:3001
      - VITE_API_URL=
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - TZ=America/Sao_Paulo
      - POSTGRES_DB=wa_invites
      - POSTGRES_USER=wa_invites
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wa_invites}
    command: ["postgres", "-c", "timezone=America/Sao_Paulo", "-c", "log_timezone=America/Sao_Paulo"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa_invites -d wa_invites"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  wwebjs_auth:
